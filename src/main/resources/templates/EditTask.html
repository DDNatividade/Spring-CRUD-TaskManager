<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit Product - QB.STORE</title>

<!-- Bootstrap 5.3.3 -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">

<style>

	.card {
		border: none;
		border-radius: 1rem;
		box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
	}
	.card h2 {
		font-weight: 600;
		color: #0d6efd;
	}
	.form-label {
		font-weight: 500;
		color: #333;
	}
	.btn-primary {
		background-color: #0d6efd;
		border: none;
	}
	.btn-primary:hover {
		background-color: #0b5ed7;
	}
	.btn-secondary {
		border: none;
	}
	img {
		border-radius: 0.5rem;
		box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
	}
</style>
</head>

<body>
	
	<div
		class="container vh-100 d-flex justify-content-center align-items-center">
		<div class="col-md-4 bg-white p-4 rounded shadow-sm">
			<h3 class="text-center mb-4">Edit New task</h3>

			<form th:action="@{/tasks/edit(id=${task.id})}" method="post"
				th:object="${tasksDTO}">

				<!-- CSRF Token -->
				<input type="hidden" th:name="${_csrf.parameterName}"
					th:value="${_csrf.token}" />

				<div class="mb-3">
					<label for="name" class="form-label">Name</label> <input
						type="text" th:field="*{name}" class="form-control" id="name"
						placeholder="Enter task name">
					<div th:errorclass="text-danger"
						th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

				</div>

				<div class="mb-3">
					<label for="description" class="form-label">Description</label>
					<textarea th:field="*{description}" class="form-control"
						id="description" rows="4"
						placeholder="Write a short description..."></textarea>
					<div th:errorclass="text-danger"
						th:if="${#fields.hasErrors('description')}"
						th:errors="*{description}"></div>

				</div>

				<div class="mb-3">
					<label for="category" class="form-label">Category</label> <input
						type="text" th:field="*{category}" class="form-control" id="category"
						placeholder="Enter category">
					<div th:errorclass="text-danger"
						th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>

				</div>



				<div class="mb-3">
					<label for="category" class="form-label">Priority</label>

				</div>

				<div class="mb-3">
					<select id="priority" class="form-select" th:field="*{priority}">
						<option value="" disabled selected>-- Select Priority --</option>
						<option th:each="p : ${priorities}" th:value="${p}" th:text="${p}">
						</option>
					</select>

					<div th:errorclass="text-danger"
						th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></div>

				</div>

				<div class="d-flex justify-content-between">
					<a href="/user" class="btn btn-secondary">Cancel</a>
					<button type="submit" class="btn btn-primary">Save Product</button>
				</div>

			</form>
		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</body>
</html>
